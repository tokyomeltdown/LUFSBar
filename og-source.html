<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<!--
  Source for docs/og-image.png. Rendered rather than drawn by hand so the card
  keeps the page's colours when they change.

      bash make-og.sh

  1200x630 is what the social cards crop to. Everything that has to survive a
  thumbnail sits in the middle half. Same ground, grid and type as the page,
  with the app icon.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#ffffff;color:#1d1d1f;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(29,29,31,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(29,29,31,.05) 1px,transparent 1px);
    background-size:48px 48px;background-position:-1px -1px}
  .left{position:absolute;left:72px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center}
  .k{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#6e6e73;margin-bottom:26px}
  h1{font-size:68px;line-height:1.04;font-weight:700;letter-spacing:-.03em}
  .sub{margin-top:24px;font-size:23px;line-height:1.45;color:#515154;max-width:21em}
  .foot{margin-top:30px;font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.06em;color:#6e6e73}
  .foot b{color:#1d1d1f;font-weight:600}

  .icon{position:absolute;right:112px;top:50%;width:300px;height:300px;margin-top:-150px;border-radius:66px;
    box-shadow:0 34px 80px -18px rgba(30,24,70,.45)}
</style>
</head>
<body>
<div class="left">
  <div class="k">LUFSBar · for macOS</div>
  <h1>Your Mac's sound output, measured.</h1>
  <p class="sub">A free LUFS meter in your menu bar, with no virtual audio device.</p>
  <p class="foot">macOS 14.4+ &nbsp;·&nbsp; Apple silicon &amp; Intel &nbsp;·&nbsp; <b>Free</b></p>
</div>
<img class="icon" src="LUFSBar/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png" alt="">
</body>
</html>
